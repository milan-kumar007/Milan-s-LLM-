[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "milans-llm"
version = "0.1.0"
description = "Milan's LLM: A 124M-parameter GPT transformer built from scratch in PyTorch with CUDA acceleration, Supervised Fine-Tuning (SFT), and an interactive streaming desktop GUI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Milan" }
]
keywords = [
    "llm",
    "deep-learning",
    "pytorch",
    "transformer",
    "gpt",
    "nlp",
    "cuda",
    "instruction-tuning",
    "sft",
    "generative-ai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "tokenizers>=0.19.0",
    "numpy>=1.24.0",
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.9.0",
]

[project.urls]
"Homepage" = "https://github.com/milan/milans-llm"
"Repository" = "https://github.com/milan/milans-llm"
"Bug Tracker" = "https://github.com/milan/milans-llm/issues"
